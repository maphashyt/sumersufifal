<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>idk what to put here lol</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="video-container">
    <!-- Points directly to video.mp4 in the same directory -->
    <video id="my-video" src="video.mp4" preload="metadata"></video>

    <!-- Custom controls -->
    <div class="controls">
      <button id="play-btn" class="btn">Play</button>
      <input type="range" id="seek-bar" value="0" min="0" step="0.1" />
      <span id="time-display">0:00 / 0:00</span>
      <button id="mute-btn" class="btn">Mute</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
